<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="แผนที่ผู้ขอรับใบอนุญาตใช้น้ำ ลุ่มน้ำมูล ดึงข้อมูลจาก Google ชีต">
<title>ลุ่มน้ำมูล · ผู้ขอรับใบอนุญาตใช้น้ำในเขต สชป.8</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --paper:#f4f0e8; --ink:#1a2620; --muted:#5a6760; --line:#ddd5c6;
  --teal:#0c6b65; --teal-deep:#08524d; --card:#fffdf9; --clay:#b44a24;
  --wash:#e3f1ef; --map:#dce8e2; --shadow:0 1px 3px rgba(26,38,32,.08);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Leelawadee UI","Sarabun","Segoe UI",Tahoma,sans-serif;
  line-height:1.45;-webkit-text-size-adjust:100%;overflow:hidden;
}
button,input,a{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{text-decoration:none}
.shell{
  display:grid;height:100%;height:100dvh;
  grid-template-rows:auto minmax(0,1fr);
  padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
}
.topbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
  padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);
  box-shadow:var(--shadow);z-index:1000;
}
.brand{min-width:0;flex:1 1 auto}
.brand .brand-main{margin:0;color:var(--teal);font-size:clamp(1.25rem,4vw,1.75rem);font-weight:800;line-height:1.2;letter-spacing:.02em}
.brand .brand-sub{margin:3px 0 0;color:var(--ink);font-size:clamp(0.8rem,2.2vw,0.95rem);font-weight:600;line-height:1.3}
.actions{display:flex;flex-wrap:wrap;gap:6px;flex-shrink:0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);font-weight:600;font-size:13px;white-space:nowrap;
}
.btn:hover{background:var(--paper)}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-deep)}
.main{display:grid;min-height:0;grid-template-rows:minmax(40vh,1fr) minmax(38vh,1fr)}
@media(min-width:768px){
  .main{grid-template-columns:minmax(280px,340px) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .panel{order:1;border-right:1px solid var(--line);border-top:0}
  .map-wrap{order:2}
}
@media(min-width:1100px){.main{grid-template-columns:minmax(300px,380px) minmax(0,1fr)}}
.map-wrap{position:relative;min-height:0;background:var(--map)}
#map{position:absolute;inset:0;touch-action:pan-x pan-y}
.leaflet-container{font-family:inherit;background:var(--map);width:100%;height:100%}
.leaflet-bar a{color:var(--ink);background:var(--card)}
.map-tools{position:absolute;top:10px;left:10px;z-index:500;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 56px)}
.map-tools .btn{box-shadow:var(--shadow);height:36px;min-height:36px;font-size:12px;padding:0 10px}
.map-legend{
  position:absolute;right:10px;bottom:56px;z-index:500;
  display:flex;flex-direction:column;gap:6px;
  padding:8px 10px;border-radius:8px;
  background:rgba(255,253,249,.94);border:1px solid var(--line);
  box-shadow:var(--shadow);font-size:12px;font-weight:600;color:var(--ink);
  pointer-events:none;
}
.leg-item{display:flex;align-items:center;gap:8px;line-height:1.2}
.leg-drop{display:flex;width:16px;height:16px;align-items:center;justify-content:center;flex-shrink:0}
.leg-circle{
  width:12px;height:12px;border-radius:50%;flex-shrink:0;
  background:#FFA94D;border:1.5px solid #e8590c;
}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--card);border-top:1px solid var(--line)}
.panel-head{padding:8px 10px;border-bottom:1px solid var(--line);flex-shrink:0;overflow:auto;max-height:48%}
@media(min-width:768px){.panel-head{max-height:none;overflow:visible}}
.search{display:flex;align-items:center;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.search input{width:100%;border:0;background:transparent;outline:none;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chips button{min-height:28px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:12px}
.chips button[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700}
.chips button.art[aria-pressed="true"]{background:#1f4b8f;border-color:#1f4b8f}
.chips button.perm[aria-pressed="true"]{background:#9c36b5;border-color:#9c36b5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.stats>div{padding:5px 4px;border-radius:6px;background:var(--paper)}
.stats-license{margin-top:4px}
.stats-license .clickable{cursor:pointer;border:1px solid transparent;transition:border-color .15s,background .15s}
.stats-license .clickable:hover{border-color:var(--clay);background:#fff5f0}
.stats-license .clickable.on{border-color:var(--clay);background:#fff0eb}
.stats-license .quiet-box:hover{border-color:var(--line);background:var(--paper)}
.stats-license .quiet-box.on{border-color:var(--teal);background:var(--wash)}
.stats dt{color:var(--muted);font-size:10px;margin:0;line-height:1.2}
.stats dd{margin:1px 0 0;font-weight:700;font-variant-numeric:tabular-nums;font-size:12px;line-height:1.2}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.tools button{min-height:24px;border:0;background:transparent;padding:0;font-weight:700;color:var(--teal);font-size:12px}
.tools button.quiet{color:var(--muted);font-weight:500}
.status{margin:4px 0 0;font-size:11px;color:var(--muted);line-height:1.3}
.status.err{color:var(--clay)}
.detail{margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);max-height:42vh;overflow:auto}
.detail h2{margin:0;font-size:13px;line-height:1.3;font-weight:700}
.detail .area{margin:2px 0 0;color:var(--muted);font-size:11px;line-height:1.3}
.detail dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:8px 0 0}
.detail dt{color:var(--muted);font-size:10px;margin:0;line-height:1.2}
.detail dd{margin:1px 0 0;font-weight:700;font-size:12px;line-height:1.3;word-break:break-word}
.detail .wide{grid-column:1/-1}
.meta{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.35}
.card-top{display:flex;gap:6px;align-items:flex-start}
.card-top button{margin-left:auto;width:28px;height:28px;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;flex-shrink:0;padding:0}
.list{min-height:0;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.group{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.swatch{width:10px;height:10px;border-radius:999px;flex:none}
.group button.name{flex:1;min-width:0;text-align:left;border:0;background:transparent;font-weight:700;padding:8px 0;font-size:13px;line-height:1.3}
.count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex-shrink:0}
.row{display:flex;width:100%;gap:10px;min-height:52px;padding:10px 12px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent}
.row:hover{background:rgba(12,107,101,.04)}
.row.on{background:var(--wash)}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-weight:500;font-size:14px;line-height:1.35}
.row .who span,.vol{color:var(--muted);font-size:12px}
.vol{font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.tag{color:#1f4b8f;font-weight:600}
.empty{padding:16px}
.footer-note{padding:8px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;flex-shrink:0}
.loading-overlay{
  position:absolute;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;
  background:rgba(244,240,232,.82);font-weight:600;color:var(--muted);
}
.loading-overlay.hide{display:none}
.province-label{
  background:rgba(255,253,249,.92);
  border:1px solid var(--line);
  border-radius:6px;
  color:var(--ink);
  font-weight:700;
  font-size:12px;
  padding:2px 8px;
  box-shadow:var(--shadow);
}
.province-label::before{display:none}
.marker-drop-wrap{background:transparent!important;border:none!important}
.marker-drop{
  background:transparent;border:none;
  display:block;
}
.marker-drop svg{display:block;width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.marker-drop.on svg{filter:drop-shadow(0 0 2px rgba(0,0,0,.55))}
@media(max-width:380px){
  .actions .btn{padding:0 8px;font-size:12px}
  .brand h1{font-size:0.9rem}
}
@media(max-height:500px) and (orientation:landscape){
  .main{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) minmax(200px,45vw)}
  .map-wrap{order:1}
  .panel{order:2;border-top:0;border-left:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1 class="brand-main">ลุ่มน้ำมูล</h1>
      <p class="brand-sub">ผู้ขอรับใบอนุญาตใช้น้ำในเขต สชป.8</p>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="btn-reload">รีเฟรชข้อมูล</button>
      <button type="button" class="btn" id="dl-kml">ดาวน์โหลด KML</button>
      <button type="button" class="btn btn-primary" id="fit-btn">เห็นทุกจุด</button>
    </div>
  </header>
  <div class="main">
    <aside class="panel">
      <div class="panel-head">
        <label class="search">
          <input id="q" type="search" placeholder="ค้นหาชื่อผู้ขอ · แหล่งน้ำ · จังหวัด" aria-label="ค้นหา">
        </label>
        <div class="chips" id="activity"></div>
        <div class="chips" id="article"></div>
        <div class="chips" id="permit"></div>
        <dl class="stats">
          <div><dt>จำนวนผู้ใช้น้ำ</dt><dd id="n-points">0</dd></div>
          <div><dt>รวมเดือน</dt><dd id="n-month">0</dd></div>
          <div><dt>รวมต่อปี</dt><dd id="n-year">0</dd></div>
        </dl>
        <dl class="stats stats-license">
          <div><dt>ออกใบอนุญาตแล้ว</dt><dd id="n-issued">0</dd></div>
          <div class="clickable" id="box-pending" title="กดเพื่อดูเฉพาะที่ยังไม่ออกใบอนุญาต">
            <dt>คงค้างในระบบ</dt><dd id="n-pending">0</dd>
          </div>
          <div class="clickable quiet-box" id="box-all-license" title="แสดงทั้งหมด">
            <dt>สถานะที่เลือก</dt><dd id="n-license-filter">ทั้งหมด</dd>
          </div>
        </dl>
        <p class="status" id="status">กำลังเตรียม...</p>
        <div class="tools">
          <button type="button" id="show-all">แสดงทุกพื้นที่บนแผนที่</button>
          <button type="button" class="quiet" id="hide-all">ซ่อนทั้งหมด</button>
          <button type="button" class="quiet" id="collapse-all">ย่อรายละเอียด</button>
        </div>
        <div id="detail"></div>
      </div>
      <div class="list" id="list"></div>
      <p class="footer-note">กดชื่อโครงการเพื่อดูรายชื่อ · ข้อมูลจาก Google ชีต</p>
    </aside>
    <section class="map-wrap">
      <div id="map" role="application" aria-label="แผนที่ผู้ใช้น้ำ"></div>
      <div class="map-tools">
        <button type="button" class="btn" id="fit">เห็นทุกจุด</button>
        <button type="button" class="btn" id="switch-tiles">แผนที่: แผนที่</button>
      </div>
      <div class="map-legend" aria-label="สัญลักษณ์บนแผนที่">
        <div class="leg-item">
          <span class="leg-drop" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2.2c0 0-7 8.1-7 13.1a7 7 0 0 0 14 0c0-5-7-13.1-7-13.1z" fill="#4DABF7" stroke="#1c7ed6" stroke-width="1.2" stroke-linejoin="round"/>
            </svg>
          </span>
          <span>ประปา</span>
        </div>
        <div class="leg-item">
          <span class="leg-circle" aria-hidden="true"></span>
          <span>อุตสาหกรรม</span>
        </div>
      </div>
      <div class="loading-overlay" id="loading">กำลังโหลดข้อมูลจากชีต...</div>
    </section>
  </div>
</div>

function formatNumber(v) {

}
function formatVolume(v, textFallback) {

}
function formatCompact(v) {

function formatThaiDate(v) {
  if (v == null) return "-";
  const s = String(v).trim();
  if (!s) return "-";
  const months = [
    "", "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
    "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
  ];
  // รองรับ YYYY-MM-DD, YYYY/MM/DD, DD/MM/YYYY, Date object serialised
  let y, m, d;
  let m1 = s.match(/^(\d{4})[\-/](\d{1,2})[\-/](\d{1,2})/);
  let m2 = s.match(/^(\d{1,2})[\-/](\d{1,2})[\-/](\d{4})/);
  if (m1) {
    y = parseInt(m1[1], 10);
    m = parseInt(m1[2], 10);
    d = parseInt(m1[3], 10);
  } else if (m2) {
    d = parseInt(m2[1], 10);
    m = parseInt(m2[2], 10);
    y = parseInt(m2[3], 10);
  } else {
    const dt = new Date(s);
    if (!isNaN(dt.getTime())) {
      d = dt.getDate();
      m = dt.getMonth() + 1;
      y = dt.getFullYear();
      // ถ้าเป็นปีคริสต์ศักราชช่วงสมัยใหม่ และข้อมูลใบอนุญาตมักเป็น พ.ศ. ถ้าปี < 2400 แปลงเป็น พ.ศ.
      if (y > 0 && y < 2400) y += 543;
    } else {
      return s;
    }
  }
  if (!y || !m || !d || m < 1 || m > 12) return s;
  // ถ้าปีเป็น ค.ศ. (เช่น 2025) แสดงเป็น พ.ศ.
  if (y > 0 && y < 2400) y += 543;
  return d + " " + months[m] + " " + y;
}

    const lat = num(pick(row, ["latitude", "พิกัดจุดสูบน้ำ latitude", "lat"]));
    const lng = num(pick(row, ["longitude", "พิกัดจุดสูบน้ำ Longitude", "lng", "lon"]));
    const yearRaw = pick(row, ["ปริมาณการใช้น้ำเฉลี่ยต่อปี", "year"]);
    const yearNum = num(yearRaw);
    const yearText = yearNum == null && yearRaw !== "" && yearRaw != null ? text(yearRaw) : null;
    const month = num(pick(row, ["ปริมาณการใช้น้ำเฉลี่ยต่อเดือน", "ปริมาณการใช้น้ำเฉลี่ยต่อเดือน(ของใหม่)", "month"]));
    const article = articleOf(pick(row, ["ทางน้ำมาตรา", "article"]));
    const hasCoord = lat != null && lng != null && lat > 5 && lat < 21 && lng > 97 && lng < 106;
    if (!hasCoord) return; // ไม่แสดงรายการไม่มีพิกัด

    if (!seen.has(area)) {
      seen.add(area);
      areaNames.push(area);
    }
    users.push({
      id: idx + 1,
      name,
      permitType: num(pick(row, ["ประเภท", "permitType"])),
      article,
      userType: text(pick(row, ["ผู้ใช้น้ำ", "userType"])),
      area,
      province: text(pick(row, ["จังหวัด", "province"])),
      activity: text(pick(row, ["กิจกรรมใช้น้ำ", "activity"])),
      source: text(pick(row, ["แหล่งน้ำต้นทุน", "source"])),
      month,
      year: yearNum,
      yearText,
      lat,
      lng,
      note: text(pick(row, ["หมายเหตุ", "note"])),
      license: text(pick(row, ["ใบอนุญาตเลขที่", "license"])),
      startDate: text(pick(row, ["วันเริ่มใบอนุญาต", "startDate"])),
      endDate: text(pick(row, ["วันหมดอายุใบอนุญาต", "endDate"])),
      areaKey: ""
    });
  });

  // จัดลำดับพื้นที่ตาม CONFIG.areaOrder แล้วต่อด้วยพื้นที่อื่น
  const orderedNames = [];
  CONFIG.areaOrder.forEach(n => { if (seen.has(n)) orderedNames.push(n); });
  areaNames.forEach(n => { if (!orderedNames.includes(n)) orderedNames.push(n); });

  const areas = orderedNames.map((name, i) => ({
    key: "a" + (i + 1),
    name,
    color: CONFIG.colors[i % CONFIG.colors.length]
  }));
  const keyBy = Object.fromEntries(areas.map(a => [a.name, a.key]));
  users.forEach(u => { u.areaKey = keyBy[u.area]; });

  return { areas, users };
}

function hasLicense(u) {
  // นับเฉพาะเลขที่ใบอนุญาตจริง — ไม่นับช่องว่าง / "-" / ข้อความสถานะ เช่น อยู่ระหว่างออกใบอนุญาต
  const s = u.license == null ? "" : String(u.license).trim();
  if (!s || s === "-" || s === "–" || s === "—") return false;
  if (/อยู่ระหว่าง|รอประชุม|รอออก|ยังไม่มี|ไม่มี|กำลังดำเนินการ|ตรวจสอบ/.test(s)) return false;
  if (!/\d/.test(s)) return false;
  return true;
}
function matches(u) {
  if (state.activity !== "all" && u.activity !== state.activity) return false;
  if (state.permit !== "all" && String(u.permitType) !== state.permit) return false;
  if (state.license === "issued" && !hasLicense(u)) return false;
  if (state.license === "pending" && hasLicense(u)) return false;
  if (state.article !== "all") {
    if (String(u.article) !== state.article) return false;
  }
  if (!state.q) return true;
  return (u.name + " " + u.source + " " + u.province + " " + u.area + " " + articleText(u.article))
    .toLowerCase().includes(state.q);
}
function visibleUsers() {
  return DATA.users.filter(u => matches(u) && !hidden.has(u.areaKey));
}
function coordsOf(rows) {
  return rows.filter(u => u.lat != null && u.lng != null).map(u => [u.lat, u.lng]);
}
function fit(coords, maxZoom) {
  if (!coords.length) return;
  map.invalidateSize();
  if (coords.length === 1) map.setView(coords[0], 12);
  else map.fitBounds(coords, { padding: [36, 36], maxZoom: maxZoom || 12 });
}

function draw() {
  const rows = visibleUsers();
  layer.clearLayers();
  rows.forEach(u => {
    const color = (areaByKey.get(u.areaKey) || {}).color || "#0c6b65";
    const on = state.selected === u.id;
    const isWater = (u.activity || "").indexOf("ประปา") >= 0;
    let m;
    if (isWater) {
      // ขนาดตามปริมาณน้ำ (สเกลเดียวกับวงกลม) — หน่วยพิกเซล
      const r = radius(u) + (on ? 2 : 0);
      const size = Math.max(14, Math.min(36, Math.round(r * 2.2)));
      const stroke = on ? "#1a2620" : color;
      const sw = on ? 2 : 1.25;
      const html =
        '<div class="marker-drop' + (on ? " on" : "") + '" style="width:' + size + "px;height:" + size + 'px">' +
        '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M12 2.2c0 0-7 8.1-7 13.1a7 7 0 0 0 14 0c0-5-7-13.1-7-13.1z" fill="' + color +
        '" stroke="' + stroke + '" stroke-width="' + sw + '" stroke-linejoin="round"/></svg></div>';
      m = L.marker([u.lat, u.lng], {
        icon: L.divIcon({
          className: "marker-drop-wrap",
          html: html,
          iconSize: [size, size],
          iconAnchor: [size / 2, size]  // ปลายหยดน้ำชี้ที่พิกัด
        }),
        keyboard: false,
        zIndexOffset: on ? 600 : 100
      });
        } else {
      m = L.circleMarker([u.lat, u.lng], {
        radius: radius(u) + (on ? 3 : 0),
        color: on ? "#1a2620" : color,
        weight: on ? 3 : 1,
        fillColor: color,
        fillOpacity: 0.92
      });
    }
    m.bindTooltip(u.name, { direction: "top", opacity: 1 });
    m.on("click", () => { state.selected = u.id; render(); });
    m.addTo(layer);
  });
  if (!fitted && rows.length) {
    fit(coordsOf(rows), 10);
    fitted = true;
  }
  document.getElementById("n-points").textContent = formatNumber(rows.length);
  document.getElementById("n-month").textContent = formatCompact(rows.reduce((s, u) => s + (u.month || 0), 0));
  document.getElementById("n-year").textContent = formatCompact(rows.reduce((s, u) => s + (u.year || 0), 0));
  // สรุปใบอนุญาต: นับจากตัวกรองอื่น (ไม่นับตัวกรองสถานะใบอนุญาต) เพื่อให้เห็นภาพรวม
  const base = DATA.users.filter(u => {
    if (state.activity !== "all" && u.activity !== state.activity) return false;
    if (state.permit !== "all" && String(u.permitType) !== state.permit) return false;
    if (state.article !== "all" && String(u.article) !== state.article) return false;
    if (state.q) {
      const hay = (u.name + " " + u.source + " " + u.province + " " + u.area + " " + articleText(u.article)).toLowerCase();
      if (!hay.includes(state.q)) return false;
    }
    return true;
  });
  const issuedN = base.filter(hasLicense).length;
  const pendingN = base.length - issuedN;
  document.getElementById("n-issued").textContent = formatNumber(issuedN);
  document.getElementById("n-pending").textContent = formatNumber(pendingN);
  const lab = document.getElementById("n-license-filter");
  lab.textContent = state.license === "pending" ? "คงค้าง" : state.license === "issued" ? "ออกแล้ว" : "ทั้งหมด";
  document.getElementById("box-pending").classList.toggle("on", state.license === "pending");
  document.getElementById("box-all-license").classList.toggle("on", state.license === "all");
  renderDetail();
  renderList();
}

function renderDetail() {
  const host = document.getElementById("detail");
  const u = DATA.users.find(x => x.id === state.selected);
  if (!u || !matches(u)) { host.innerHTML = ""; return; }
  const meta = [u.province, u.activity, u.userType]
    .filter(Boolean).join(" · ");
  function dash(v) {
    const s = v == null ? "" : String(v).trim();
    return s ? s : "-";
  }
  host.innerHTML =
    '<article class="detail"><div class="card-top"><div><h2>' + esc(u.name) +
    '</h2><p class="area">' + esc(u.area) +
    '</p></div><button type="button" id="close" aria-label="ปิด">×</button></div><dl>' +
    '<div class="wide"><dt>เลขที่ใบอนุญาต</dt><dd>' + esc(dash(u.license)) + "</dd></div>" +
    "<div><dt>วันเริ่มใบอนุญาต</dt><dd>" + esc(formatThaiDate(u.startDate)) + "</dd></div>" +
    "<div><dt>วันสิ้นสุดใบอนุญาต</dt><dd>" + esc(formatThaiDate(u.endDate)) + "</dd></div>" +
    "<div><dt>ทางน้ำ</dt><dd>" + esc(articleText(u.article)) + "</dd></div>" +
    "<div><dt>ผู้ใช้น้ำ</dt><dd>" + esc(u.permitType != null && u.permitType !== "" ? ("ประเภทที่ " + u.permitType) : "-") + "</dd></div>" +
    '<div class="wide"><dt>แหล่งน้ำต้นทุน</dt><dd>' + esc(u.source || "ไม่ระบุ") + "</dd></div>" +
    "<div><dt>เฉลี่ยต่อเดือน</dt><dd>" + esc(formatVolume(u.month)) + "</dd></div>" +
    "<div><dt>เฉลี่ยต่อปี</dt><dd>" + esc(formatVolume(u.year, u.yearText)) + "</dd></div></dl>" +
    (meta ? '<p class="meta">' + esc(meta) + "</p>" : "") +
    (u.note ? '<p class="meta">' + esc(u.note) + "</p>" : "") +
    "</article>";
  document.getElementById("close").onclick = () => { state.selected = null; render(); };
}

function renderList() {
  const host = document.getElementById("list");
  const parts = [];
  let any = false;
  DATA.areas.forEach(area => {
    const rows = DATA.users.filter(u => u.areaKey === area.key && matches(u));
    if (!rows.length) return;
    any = true;
    const onMap = !hidden.has(area.key);
    const open = expanded.has(area.key);
    parts.push(
      '<div class="group"><input type="checkbox" data-area="' + area.key + '"' +
      (onMap ? " checked" : "") + ' aria-label="แสดงบนแผนที่ ' + esc(area.name) +
      '"><span class="swatch" style="background:' + area.color +
      '"></span><button type="button" class="name" data-focus="' + area.key +
      '" title="' + esc(area.name) + '">' +
      (open ? "▼ " : "▶ ") + esc(area.name) +
      '</button><span class="count">' + rows.length + "</span></div>"
    );
    if (!open) return;
    rows.forEach(u => {
      parts.push(
        '<button type="button" class="row' + (state.selected === u.id ? " on" : "") +
        '" data-user="' + u.id + '"><span class="who"><b>' + esc(u.name) +
        '</b><span><span class="tag">' + esc(articleText(u.article)) + "</span> · " +
        esc(u.source || "ไม่ระบุแหล่งน้ำ") +
        '</span></span><span class="vol">' +
        (u.month == null ? "—" : formatCompact(u.month)) +
        "</span></button>"
      );
    });
  });
  if (!any) parts.push('<p class="empty">ไม่พบรายการที่ตรงกับคำค้น</p>');
  host.innerHTML = parts.join("");
  host.querySelectorAll("[data-area]").forEach(box => {
    box.onchange = () => {
      if (box.checked) hidden.delete(box.dataset.area);
      else hidden.add(box.dataset.area);
      draw();
    };
  });
  host.querySelectorAll("[data-focus]").forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.focus;
      if (expanded.has(key)) expanded.delete(key);
      else expanded.add(key);
      hidden.delete(key);
      fit(coordsOf(DATA.users.filter(u => u.areaKey === key && matches(u))));
      draw();
    };
  });
  host.querySelectorAll("[data-user]").forEach(btn => {
    btn.onclick = () => {
      const u = DATA.users.find(x => x.id === Number(btn.dataset.user));
      if (!u || !matches(u)) return;
      state.selected = u.id;
      if (u.lat != null) map.flyTo([u.lat, u.lng], Math.max(map.getZoom(), 12), { duration: 0.45 });
      render();
    };
  });
}

function render() { draw(); }

function chipRow(host, options, key, extraClass) {
  host.innerHTML = options.map(([id, label]) =>
    '<button type="button" class="' + (extraClass || "") + '" data-id="' + id +
    '" aria-pressed="' + (state[key] === id) + '">' + label + "</button>"
  ).join("");
  host.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      state[key] = btn.dataset.id;
      if (state.selected != null) {
        const sel = DATA.users.find(x => x.id === state.selected);
        if (!sel || !matches(sel)) state.selected = null;
      }
      chipRow(host, options, key, extraClass);
      draw();
    };
  });
}

function buildKml() {
  const lines = [
    '<?xml version="1.0" encoding="UTF-8"?>',
    '<kml xmlns="http://www.opengis.net/kml/2.2">',
    "<Document>",
    "<name>" + xmlEsc("ผู้ขอรับใบอนุญาตใช้น้ำ · ลุ่มน้ำมูล") + "</name>",
    "<open>1</open>"
  ];
  DATA.areas.forEach(area => {
    lines.push('<Style id="style-' + area.key + '">');
    lines.push("<IconStyle>");
    lines.push("<color>" + kmlColor(area.color) + "</color>");
    lines.push("<scale>1.15</scale>");
    lines.push("<Icon><href>http://maps.google.com/mapfiles/kml/paddle/wht-circle.png</href></Icon>");
    lines.push('<hotSpot x="0.5" y="0.5" xunits="fraction" yunits="fraction"/>');
    lines.push("</IconStyle>");
    lines.push("<LabelStyle><scale>0.85</scale></LabelStyle>");
    lines.push("</Style>");
  });
  DATA.areas.forEach(area => {
    const rows = DATA.users.filter(u => u.areaKey === area.key && u.lat != null);
    if (!rows.length) return;
    lines.push("<Folder>");
    lines.push("<name>" + xmlEsc(area.name) + "</name>");
    lines.push("<open>0</open>");
    rows.forEach(u => {
      const desc =
        "<div style='font-family:Tahoma,sans-serif;font-size:13px;line-height:1.5'>" +
        "<div><b>พื้นที่รับผิดชอบ:</b> " + xmlEsc(u.area) + "</div>" +
        "<div><b>ทางน้ำ:</b> " + xmlEsc(articleText(u.article)) + "</div>" +
        "<div><b>แหล่งน้ำต้นทุน:</b> " + xmlEsc(u.source || "ไม่ระบุ") + "</div>" +
        "<div><b>เฉลี่ยต่อเดือน:</b> " + xmlEsc(formatVolume(u.month)) + "</div>" +
        "<div><b>เฉลี่ยต่อปี:</b> " + xmlEsc(formatVolume(u.year, u.yearText)) + "</div>" +
        "</div>";
      lines.push("<Placemark>");
      lines.push("<name>" + xmlEsc(u.name) + "</name>");
      lines.push("<styleUrl>#style-" + area.key + "</styleUrl>");
      lines.push("<description><![CDATA[" + desc + "]]></description>");
      lines.push("<Point><coordinates>" + u.lng + "," + u.lat + ",0</coordinates></Point>");
      lines.push("</Placemark>");
    });
    lines.push("</Folder>");
  });
  lines.push("</Document></kml>");
  return lines.join("\n");
}
function downloadKml() {
  const blob = new Blob([buildKml()], { type: "application/vnd.google-earth.kml+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ฐานข้อมูลผู้ใช้น้ำ.kml";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function setStatus(msg, isErr) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status" + (isErr ? " err" : "");
}

async function loadData() {
  const loading = document.getElementById("loading");
  loading.classList.remove("hide");
  fitted = false;
  state.selected = null;
  hidden.clear();
  expanded.clear();

  if (!CONFIG.dataUrl || !String(CONFIG.dataUrl).trim()) {
    loading.classList.add("hide");
    setStatus("ยังไม่ได้ตั้งค่า dataUrl — เปิดไฟล์แล้วใส่ URL เว็บแอป Apps Script ใน CONFIG.dataUrl", true);
    DATA = { areas: [], users: [] };
    draw();
    return;
  }

  setStatus("กำลังโหลดข้อมูลจากชีต...");
  try {
    const res = await fetch(CONFIG.dataUrl, { method: "GET", redirect: "follow", cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    const raw = Array.isArray(json) ? json : (json.rows || json.data || []);
    DATA = normalizeRows(raw);
    areaByKey = new Map(DATA.areas.map(a => [a.key, a]));
    const updated = json.updated ? new Date(json.updated).toLocaleString("th-TH") : "";
    setStatus("โหลดแล้ว " + DATA.users.length + " รายการ" + (updated ? " · อัปเดต " + updated : ""));
    draw();
  } catch (err) {
    console.error(err);
    setStatus("โหลดไม่สำเร็จ: " + (err && err.message ? err.message : err) + " — ตรวจ URL เว็บแอปและการอนุญาตสิทธิ์", true);
    DATA = { areas: [], users: [] };
    draw();
  } finally {
    loading.classList.add("hide");
    setTimeout(() => map.invalidateSize(), 150);
  }
}

chipRow(document.getElementById("activity"),
  [["all", "ทั้งหมด"], ["ประปา", "ประปา"], ["อุตสาหกรรม", "อุตสาหกรรม"]], "activity", "");
chipRow(document.getElementById("article"),
  [["all", "ทุกมาตรา"], ["5", "มาตรา 5"], ["8", "มาตรา 8"]], "article", "art");
chipRow(document.getElementById("permit"),
  [["all", "ทุกประเภท"], ["2", "ประเภทที่ 2"], ["3", "ประเภทที่ 3"]], "permit", "perm");

document.getElementById("q").oninput = e => {
  state.q = e.target.value.trim().toLowerCase();
  draw();
};
document.getElementById("show-all").onclick = () => { hidden.clear(); draw(); };
document.getElementById("hide-all").onclick = () => {
  DATA.areas.forEach(a => hidden.add(a.key));
  draw();
};
document.getElementById("collapse-all").onclick = () => {
  expanded.clear();
  state.selected = null;
  draw();
};
function doFit() { fit(coordsOf(visibleUsers())); }
document.getElementById("fit").onclick = doFit;
document.getElementById("fit-btn").onclick = doFit;
document.getElementById("dl-kml").onclick = downloadKml;
document.getElementById("switch-tiles").onclick = () => addGoogleTiles(tileMode + 1);
document.getElementById("btn-reload").onclick = () => loadData();
document.getElementById("box-pending").onclick = () => {
  state.license = state.license === "pending" ? "all" : "pending";
  if (state.selected != null) {
    const sel = DATA.users.find(x => x.id === state.selected);
    if (!sel || !matches(sel)) state.selected = null;
  }
  // ขยายรายการโครงการที่มีคงค้าง
  if (state.license === "pending") {
    DATA.areas.forEach(a => {
      const has = DATA.users.some(u => u.areaKey === a.key && matches(u));
      if (has) expanded.add(a.key);
    });
  }
  draw();
};
document.getElementById("box-all-license").onclick = () => {
  state.license = "all";
  draw();
};
// คลิกจำนวนออกแล้ว = กรองเฉพาะที่ออกแล้ว
document.getElementById("n-issued").closest("div").onclick = () => {
  state.license = state.license === "issued" ? "all" : "issued";
  if (state.selected != null) {
    const sel = DATA.users.find(x => x.id === state.selected);
    if (!sel || !matches(sel)) state.selected = null;
  }
  draw();
};
document.getElementById("n-issued").closest("div").style.cursor = "pointer";

function refreshMapSize() { map.invalidateSize(); }
window.addEventListener("resize", refreshMapSize);
window.addEventListener("orientationchange", () => setTimeout(refreshMapSize, 300));

loadData();
</script>
